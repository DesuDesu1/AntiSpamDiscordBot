apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  discord-token: {{ .Values.discord.token | quote }}
  discord-owner-id: {{ .Values.discord.ownerId | quote }}
{{- if .Values.postgresql.enabled }}
  postgres-password: {{ required "postgresql.password is required when postgresql.enabled is true" .Values.postgresql.password | quote }}
{{- end }}
  database-connection-string: {{ required "postgresql.connectionString is required" .Values.postgresql.connectionString | quote }}
  encryption-key: {{ .Values.encryption.key | quote }}
  internal-api-key: {{ .Values.internal.apiKey | quote }}
